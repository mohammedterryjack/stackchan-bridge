services:
  stackchan-bridge:
    build:
      context: .
    container_name: ${BRIDGE_CONTAINER:-stackchan-bridge}
    init: true  # tini as PID 1: forwards stop signals and reaps child processes
    restart: unless-stopped
    mem_limit: 448m  # measured ~120 MiB idle; make test runs a second server.py per call
    env_file: .env
    read_only: true
    tmpfs: ["/tmp", "/home/bridge:uid=1000,gid=1000"]
    volumes:
      - bookmarks:/data/bookmarks
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bookmarks:
    name: stackchan-bookmarks
