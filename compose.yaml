services:
  stackchan-bridge:
    build:
      context: .
    container_name: ${BRIDGE_CONTAINER:-stackchan-bridge}
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: ["/tmp", "/home/bridge:uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [stackchan]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stackchan:
