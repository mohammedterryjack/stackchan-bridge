# Hindsight's embedding model, served by Ollama on 192.168.1.215 (see the hindsight service).
x-embed-model: &embed_model hf.co/CompendiumLabs/bge-small-en-v1.5-gguf:F16

services:
  stackchan-bridge:
    build:
      context: .
    container_name: ${BRIDGE_CONTAINER:-stackchan-bridge}
    init: true  # reaps the detached memory reflect worker
    restart: unless-stopped
    mem_limit: 448m  # measured peak 307 MiB during make test-reflect (idle ~115-195 MiB)
    env_file: .env
    read_only: true
    tmpfs: ["/tmp", "/home/bridge:uid=1000,gid=1000"]
    environment:
      HINDSIGHT_URL: http://hindsight:8888
      # memory_server pins Hindsight's embedding model in Ollama at startup (keep_alive forever) so a recall
      # after an idle spell never waits for Ollama to load it.
      OLLAMA_URL: http://192.168.1.215:11434
      OLLAMA_EMBED_MODEL: *embed_model
      MEMORY_BANK: mo
    volumes:
      - bookmarks:/data/bookmarks
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [stackchan]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Live-learning memory (Hindsight), slim image: no PyTorch or local models in the container.
  # Embeddings are BAAI/bge-small-en-v1.5 served by Ollama on 192.168.1.215 (GGUF F16, the same model the
  # full image ran locally: vectors match it at cosine 1.0, so existing memories stay valid). There is no
  # cross-encoder reranker: recall orders results by reciprocal rank fusion (rrf) of its semantic, keyword,
  # graph and time searches. To go back to the in-container models, use image ghcr.io/vectorize-io/hindsight:1.2.0
  # and drop the EMBEDDINGS_*/RERANKER_* lines.
  # the LLM is Mo's native Metal Ollama on the host, sharing the qwen2.5-coder:7b
  # that is already resident (num_ctx 8192 matches it, so nothing gets evicted or reloaded). Memories live in the named volume.
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:1.2.0-slim
    container_name: stackchan-hindsight
    restart: unless-stopped
    mem_limit: 640m  # measured ~390 MiB idle, 409 MiB peak through a reflection
    shm_size: 1g
    stop_grace_period: 75s
    environment:
      # Control Plane web viewer (memory graph, banks, documents). It talks to the API inside this
      # container (http://localhost:8888, server-side), so only its own port is published, and only on
      # the Mac's loopback: open http://127.0.0.1:9999 on the Mac. The API port 8888 stays unpublished.
      HINDSIGHT_ENABLE_CP: "true"
      HINDSIGHT_CP_PORT: "9999"
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://192.168.1.215:11434/v1
      HINDSIGHT_API_LLM_MODEL: qwen2.5-coder:7b
      HINDSIGHT_API_LLM_OLLAMA_NUM_CTX: "8192"
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "4096"
      HINDSIGHT_API_WORKER_ID: stackchan-hindsight
      HINDSIGHT_API_ENABLE_BANK_LLM_HEALTH: "true"
      # Reflect is an agentic tool-calling loop on the shared 7B: give each LLM call and the whole
      # job minutes (it runs in the background from memory_server), and keep its context inside 8192.
      HINDSIGHT_API_LLM_TIMEOUT: "600"
      HINDSIGHT_API_REFLECT_LLM_TIMEOUT: "600"
      HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "1800"
      HINDSIGHT_API_REFLECT_MAX_ITERATIONS: "5"
      HINDSIGHT_API_REFLECT_MAX_CONTEXT_TOKENS: "4500"
      HINDSIGHT_API_REFLECT_MAX_COMPLETION_TOKENS: "1024"
      HINDSIGHT_API_BANK_STATS_CACHE_TTL_SECONDS: "0"
      HF_HUB_OFFLINE: "1"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://192.168.1.215:11434/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: *embed_model
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ollama  # placeholder: Ollama has no keys, Hindsight requires a value
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    ports:
      - "127.0.0.1:9999:9999"
    networks: [stackchan]
    healthcheck:
      test: ["CMD", "python3", "-m", "hindsight_api.http_probe", "http://localhost:8888/health", "5"]
      interval: 30s
      timeout: 10s
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stackchan:

volumes:
  bookmarks:
    name: stackchan-bookmarks
  hindsight-data:
    name: stackchan-hindsight-data
